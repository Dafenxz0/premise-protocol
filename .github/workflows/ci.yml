name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:properties
      - run: pnpm conformance
      - run: pnpm conformance:v2
      - run: pnpm conformance:next
      - run: pnpm example:quickstart
      - run: pnpm example:quickstart:test
      - run: node --test benchmarks/premise-next/storm/runner.test.mjs
      - run: pnpm benchmark:next:distributed-failures
      - run: pnpm benchmark:efficiency:v1:bounded:test
      - run: pnpm benchmark:smoke
      - run: pnpm benchmark:efficiency:check
      - run: pnpm benchmark:efficiency:self-check
      - run: pnpm benchmark:efficiency:scale
      - run: pnpm benchmark:real-world
      - run: pnpm benchmark:context-corpus
      - run: pnpm benchmark:compare
      - run: pnpm benchmark:context
      - run: pnpm benchmark:evaluate
      - run: pnpm benchmark:v2:offline
      - run: pnpm benchmark:v2:giant
      - run: pnpm examples:verify

  adoption:
    name: Adoption gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package gate and fixture self-check
        run: pnpm adoption:package-gate
      - name: Skill public-boundary gate
        run: pnpm adoption:skill-gate
      - name: Static public-boundary check
        run: pnpm adoption:static-boundary-check
      - name: Standalone plugin install gate
        run: pnpm adoption:plugin-install-gate
      - name: Cross-agent install gate
        run: pnpm adoption:agent-install-gate
      - name: Isolated Codex/Luna experiment contract
        run: pnpm adoption:codex-luna:contract
      - name: Isolated Codex/Luna credential sentinel regression
        run: pnpm adoption:codex-luna:security-test
      - name: Local real-world certification
        run: pnpm adoption:certification:test
      - name: Certification report
        run: pnpm adoption:certification
      - name: MCP server test gate
        run: pnpm mcp:test
      - name: Adoption wave fixture self-check
        run: pnpm adoption:wave-check

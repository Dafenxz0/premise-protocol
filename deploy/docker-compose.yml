name: premise-v2

services:
  postgres:
    image: ${PREMISE_POSTGRES_IMAGE:-postgres:16.4-alpine}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-premise}
      POSTGRES_USER: ${POSTGRES_USER:-premise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-not-for-production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 1m

  db-roles:
    image: ${PREMISE_POSTGRES_IMAGE:-postgres:16.4-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-premise}
      POSTGRES_USER: ${POSTGRES_USER:-premise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-not-for-production}
      PREMISE_DB_USER: ${PREMISE_DB_USER:-premise_app}
      PREMISE_DB_PASSWORD: ${PREMISE_DB_PASSWORD:-local-only-app-password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        case "$$PREMISE_DB_USER" in
          ''|*[!A-Za-z0-9_]* ) echo "PREMISE_DB_USER must be a simple SQL role name" >&2; exit 1 ;;
        esac
        test "$$PREMISE_DB_USER" != "$$POSTGRES_USER"
        test -n "$$PREMISE_DB_PASSWORD"
        case "$$PREMISE_DB_PASSWORD" in __* ) echo "PREMISE_DB_PASSWORD must be injected, not a placeholder" >&2; exit 1 ;; esac
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -v app_user="$${PREMISE_DB_USER}" -v app_password="$${PREMISE_DB_PASSWORD}" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD %L', :'app_user', :'app_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD %L', :'app_user', :'app_password') \gexec
        SELECT format('GRANT CONNECT ON DATABASE %I TO %I', current_database(), :'app_user') \gexec
        SELECT format('GRANT USAGE ON SCHEMA public TO %I', :'app_user') \gexec
        SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO %I', :'app_user') \gexec
        SELECT format('GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO %I', :'app_user') \gexec
        SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', current_user, :'app_user') \gexec
        SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I', current_user, :'app_user') \gexec
        SQL

  migrate:
    image: ${PREMISE_IMAGE:-premise-v2:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BUILD_VERSION: ${PREMISE_BUILD_VERSION:-local}
        PREMISE_NODE_BUILD_IMAGE: ${PREMISE_NODE_BUILD_IMAGE:-node:24.19.0-bookworm-slim}
        PREMISE_NODE_RUNTIME_IMAGE: ${PREMISE_NODE_RUNTIME_IMAGE:-node:24.19.0-bookworm-slim}
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${MIGRATIONS_DATABASE_URL:-postgresql://${POSTGRES_USER:-premise}:${POSTGRES_PASSWORD:-local-only-not-for-production}@postgres:5432/${POSTGRES_DB:-premise}}
      PREMISE_DB_POOL_SIZE: ${PREMISE_DB_POOL_SIZE:-16}
      PREMISE_TABLE_PREFIX: ${PREMISE_TABLE_PREFIX:-premise_v2}
      MIGRATIONS_DIR: /app/deploy/migrations
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: "no"
    command: ["node", "/app/ops/migrate.mjs"]

  premise:
    image: ${PREMISE_IMAGE:-premise-v2:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BUILD_VERSION: ${PREMISE_BUILD_VERSION:-local}
        PREMISE_NODE_BUILD_IMAGE: ${PREMISE_NODE_BUILD_IMAGE:-node:24.19.0-bookworm-slim}
        PREMISE_NODE_RUNTIME_IMAGE: ${PREMISE_NODE_RUNTIME_IMAGE:-node:24.19.0-bookworm-slim}
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      PREMISE_ENV: ${PREMISE_ENV:-development}
      PREMISE_API_TOKEN: ${PREMISE_API_TOKEN:-}
      PREMISE_METRICS_TOKEN: ${PREMISE_METRICS_TOKEN:-local-only-metrics-token}
      PREMISE_STORE_MODE: postgres
      PREMISE_TABLE_PREFIX: ${PREMISE_TABLE_PREFIX:-premise_v2}
      PREMISE_TENANT_ID: ${PREMISE_TENANT_ID:-tenant:local}
      PREMISE_REQUIRE_SIGNED_ENVELOPES: ${PREMISE_REQUIRE_SIGNED_ENVELOPES:-0}
      PREMISE_SIGNATURE_KEYS_FILE: ${PREMISE_SIGNATURE_KEYS_FILE:-}
      PREMISE_SIGNATURE_MAX_CLOCK_SKEW_MS: ${PREMISE_SIGNATURE_MAX_CLOCK_SKEW_MS:-300000}
      PREMISE_MAX_BODY_BYTES: ${PREMISE_MAX_BODY_BYTES:-1048576}
      PREMISE_RUNTIME_WRITE_CONCURRENCY: ${PREMISE_RUNTIME_WRITE_CONCURRENCY:-8}
      PREMISE_RUNTIME_MAX_PENDING_WRITES: ${PREMISE_RUNTIME_MAX_PENDING_WRITES:-10000}
      PREMISE_HTTP_IDEMPOTENCY_RETENTION_MS: ${PREMISE_HTTP_IDEMPOTENCY_RETENTION_MS:-604800000}
      PREMISE_HTTP_IDEMPOTENCY_CLEANUP_INTERVAL_MS: ${PREMISE_HTTP_IDEMPOTENCY_CLEANUP_INTERVAL_MS:-3600000}
      PREMISE_DB_POOL_SIZE: ${PREMISE_DB_POOL_SIZE:-16}
      PREMISE_HEALTH_PATH: /readyz
      DATABASE_URL: ${DATABASE_URL:-postgresql://${PREMISE_DB_USER:-premise_app}:${PREMISE_DB_PASSWORD:-local-only-app-password}@postgres:5432/${POSTGRES_DB:-premise}}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-premise-v2}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=premise,service.version=2}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
    secrets:
      - source: premise_signature_public_keys
        target: premise_signature_public_keys.json
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "/app/ops/healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 30s

  prometheus:
    image: ${PREMISE_PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    secrets:
      - source: premise_metrics_token
        target: premise_metrics_token
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      premise:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  otel-collector:
    image: ${PREMISE_OTEL_IMAGE:-otel/opentelemetry-collector-contrib:0.132.0}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    restart: unless-stopped

  backup:
    image: ${PREMISE_IMAGE:-premise-v2:local}
    profiles: ["ops"]
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${PREMISE_DB_USER:-premise_app}:${PREMISE_DB_PASSWORD:-local-only-app-password}@postgres:5432/${POSTGRES_DB:-premise}}
      PREMISE_DB_POOL_SIZE: ${PREMISE_DB_POOL_SIZE:-16}
      PREMISE_TENANT_ID: ${PREMISE_TENANT_ID:-tenant:local}
      PREMISE_TABLE_PREFIX: ${PREMISE_TABLE_PREFIX:-premise_v2}
      BACKUP_FILE: /backup/premise-v2-latest.ndjson
    volumes:
      - ../.local/backups:/backup:rw
    depends_on:
      db-roles:
        condition: service_completed_successfully
    command: ["node", "/app/ops/backup.mjs"]

  restore-verify:
    image: ${PREMISE_IMAGE:-premise-v2:local}
    profiles: ["ops"]
    # Verification creates isolated temporary tables, so it uses the migration
    # owner rather than granting DDL to the long-lived application role.
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${MIGRATIONS_DATABASE_URL:-postgresql://${POSTGRES_USER:-premise}:${POSTGRES_PASSWORD:-local-only-not-for-production}@postgres:5432/${POSTGRES_DB:-premise}}
      PREMISE_DB_POOL_SIZE: ${PREMISE_DB_POOL_SIZE:-16}
      PREMISE_TENANT_ID: ${PREMISE_TENANT_ID:-tenant:local}
      PREMISE_TABLE_PREFIX: ${PREMISE_TABLE_PREFIX:-premise_v2}
      BACKUP_FILE: /backup/premise-v2-latest.ndjson
    volumes:
      - ../.local/backups:/backup:ro
    depends_on:
      db-roles:
        condition: service_completed_successfully
    command: ["node", "/app/ops/restore-verify.mjs"]

  restore:
    image: ${PREMISE_IMAGE:-premise-v2:local}
    profiles: ["ops"]
    # Destructive restore also needs the migration owner for forward-compatible
    # schema checks; the API role never receives DDL privileges.
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${MIGRATIONS_DATABASE_URL:-postgresql://${POSTGRES_USER:-premise}:${POSTGRES_PASSWORD:-local-only-not-for-production}@postgres:5432/${POSTGRES_DB:-premise}}
      PREMISE_DB_POOL_SIZE: ${PREMISE_DB_POOL_SIZE:-16}
      PREMISE_TENANT_ID: ${PREMISE_TENANT_ID:-tenant:local}
      PREMISE_TABLE_PREFIX: ${PREMISE_TABLE_PREFIX:-premise_v2}
      BACKUP_FILE: /backup/premise-v2-latest.ndjson
    volumes:
      - ../.local/backups:/backup:rw
    depends_on:
      db-roles:
        condition: service_completed_successfully
    command: ["node", "/app/ops/restore.mjs"]

volumes:
  postgres-data:
  prometheus-data:

secrets:
  premise_metrics_token:
    file: ${PREMISE_METRICS_TOKEN_FILE:-../.local/premise_metrics_token}
  premise_signature_public_keys:
    file: ${PREMISE_SIGNATURE_KEYS_SOURCE:-../.local/premise_signature_public_keys.json}

# PREMiSE v2 PostgreSQL 16 production-shaped baseline.
#
# This file is intentionally limited to settings that are safe to share across
# hosts. Memory knobs such as shared_buffers and work_mem stay environment-
# specific and use PostgreSQL defaults until the target host is measured.
#
# The file is mounted outside PGDATA by Compose, so keep the data directory
# explicit. ALTER SYSTEM overrides remain available for an operator because
# postgresql.auto.conf is included last.
data_directory = '/var/lib/postgresql/data'
listen_addresses = '*'

# One API process uses a 16-connection pool. Keep room for migrations,
# backups, monitoring, and an operator connection without encouraging a large
# number of idle backends.
max_connections = 64

# Reduce timed checkpoint churn while keeping WAL bounded for this baseline.
# max_wal_size is a soft limit; monitor free space because WAL can exceed it.
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB
wal_compression = pglz

# PREMiSE acknowledges durable writes. Keep the crash-safety settings explicit.
fsync = on
full_page_writes = on
synchronous_commit = on

include_if_exists '/var/lib/postgresql/data/postgresql.auto.conf'

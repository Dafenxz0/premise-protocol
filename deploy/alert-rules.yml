groups:
  - name: premise-v2-operational
    rules:
      - alert: PremiseHighP95Latency
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le, route) (rate(premise_http_request_duration_seconds_bucket[5m]))
          ) > 0.50
        for: 10m
        labels:
          severity: warning
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 p95 latency is high"
          description: "The p95 request latency for {{ $labels.route }} has exceeded the public 500 ms SLO for 10 minutes."

      - alert: PremiseHighP99Latency
        expr: >-
          histogram_quantile(
            0.99,
            sum by (le, route) (rate(premise_http_request_duration_seconds_bucket[5m]))
          ) > 2.0
        for: 10m
        labels:
          severity: critical
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 p99 latency is above the GA SLO"
          description: "The p99 request latency for {{ $labels.route }} has exceeded the public 2 s SLO for 10 minutes."

      - alert: PremiseHighErrorRate
        expr: >-
          (
            sum(rate(premise_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(premise_http_requests_total[5m])), 1)
          ) > 0.001
        for: 10m
        labels:
          severity: critical
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 error rate is high"
          description: "HTTP 5xx responses exceed the public 0.1% error budget for 10 minutes."

      - alert: PremiseHighClientFailureRate
        expr: >-
          (
            sum(rate(premise_http_requests_total{status=~"4.."}[5m]))
            /
            clamp_min(sum(rate(premise_http_requests_total[5m])), 1)
          ) > 0.001
        for: 10m
        labels:
          severity: warning
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 client failure rate is high"
          description: "HTTP 4xx responses exceed 0.1% for 10 minutes; semantic failures and timeouts remain part of the soak evidence gate."

      - alert: PremiseFreshnessDegraded
        expr: >-
          (
            sum(premise_freshness_records{status=~"STALE|UNKNOWN"})
            /
            clamp_min(sum(premise_freshness_records), 1)
          ) > 0.10
        for: 15m
        labels:
          severity: warning
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 freshness is degraded"
          description: "More than 10% of loaded memories are stale or unknown for 15 minutes."

      - alert: PremiseInvalidRecordsPresent
        expr: sum(premise_freshness_records{status="INVALID"}) > 0
        for: 10m
        labels:
          severity: warning
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 has invalid memories"
          description: "At least one loaded memory is marked INVALID."

      - alert: PremiseStoreNotReady
        expr: premise_store_ready == 0
        for: 5m
        labels:
          severity: critical
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 store is not ready"
          description: "The service cannot confirm its PostgreSQL persistence path."

      - alert: PremisePersistenceFailures
        expr: increase(premise_store_persistence_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 persistence failures detected"
          description: "At least one durable write batch failed in the last five minutes; inspect the application and PostgreSQL before retrying traffic."

      - alert: PremiseWriteQueueNearLimit
        expr: >-
          premise_store_pending_write_limit > 0
          and
          premise_store_pending_writes / premise_store_pending_write_limit > 0.80
        for: 5m
        labels:
          severity: warning
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 durable write queue is near capacity"
          description: "More than 80% of the admitted write queue is occupied; latency and backpressure may follow."

      - alert: PremiseWriteQueueSaturated
        expr: >-
          premise_store_pending_write_limit > 0
          and
          premise_store_pending_writes / premise_store_pending_write_limit > 0.95
        for: 2m
        labels:
          severity: critical
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 durable write queue is saturated"
          description: "The write queue is above 95% of its configured limit; protect the database and investigate before data loss or request rejection occurs."

      - alert: PremiseScrapeUnavailable
        expr: up{job="premise-v2"} == 0
        for: 5m
        labels:
          severity: critical
          service: premise-v2
        annotations:
          summary: "PREMiSE v2 metrics scrape is unavailable"
          description: "Prometheus cannot scrape the authenticated PREMiSE metrics endpoint."

      - alert: PremiseTelemetryCollectorUnavailable
        expr: up{job="otel-collector"} == 0
        for: 10m
        labels:
          severity: warning
          service: premise-v2
        annotations:
          summary: "PREMiSE telemetry collector is unavailable"
          description: "OpenTelemetry metrics are not being scraped; this does not by itself prove that the API is unavailable."

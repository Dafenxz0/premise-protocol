global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: premise-v2
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: ${PREMISE_METRICS_TOKEN}
    static_configs:
      - targets: ["premise:3000"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
